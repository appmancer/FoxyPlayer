name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v44
      with:
        files: |
          **/*.kt
          **/*.java
          **/*.xml
          **/*.gradle
          **/*.gradle.kts
          
    - name: Add automated review comment
      if: steps.changed-files.outputs.any_changed == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo, number } = context.issue;
          
          // Get list of changed files
          const changedFiles = `${{ steps.changed-files.outputs.all_changed_files }}`.split(' ');
          
          let filesList = '';
          changedFiles.forEach(file => {
            if (file.trim()) {
              filesList += `- \`${file}\`\n`;
            }
          });
          
          const reviewComment = `## 🤖 Automated Code Review Checklist
          
          This PR has been automatically analyzed. Please ensure the following before merging:
          
          ### 📱 Android Development
          - [ ] Follows Android architecture patterns (MVVM/Repository)
          - [ ] Proper lifecycle management
          - [ ] UI thread safety considerations
          - [ ] Resource management (no memory leaks)
          
          ### 🔒 Security Review
          - [ ] No hardcoded credentials or API keys
          - [ ] Proper input validation and sanitization
          - [ ] Secure network communications (HTTPS/TLS)
          - [ ] Authentication tokens handled securely
          
          ### 🎯 Kotlin Best Practices
          - [ ] Null safety properly handled
          - [ ] Coroutines used correctly for async operations
          - [ ] Extension functions used appropriately
          - [ ] Data classes for data structures
          
          ### 🧪 Testing & Quality
          - [ ] Unit tests cover new functionality
          - [ ] Integration tests for API interactions
          - [ ] Error handling tested
          - [ ] Edge cases considered
          
          ### 📝 Code Quality
          - [ ] Code is self-documenting with clear variable names
          - [ ] Functions are focused and single-purpose
          - [ ] Proper separation of concerns
          - [ ] No code duplication
          
          ### Files Changed:
          ${filesList}
          
          ---
          **Note**: This is an automated checklist to supplement human code review. GitHub Copilot may have provided additional detailed feedback above.
          
          *Generated by Android pCloud Player automated review system*`;
          
          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number: number,
            body: reviewComment
          });