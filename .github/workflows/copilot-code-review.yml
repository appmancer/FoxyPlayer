name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v44
      with:
        files: |
          **/*.kt
          **/*.java
          **/*.xml
          **/*.gradle
          **/*.gradle.kts
          
    - name: Request GitHub Copilot Review
      if: steps.changed-files.outputs.any_changed == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo, number } = context.issue;
          
          // Check if Copilot is already a reviewer
          const reviews = await github.rest.pulls.listRequestedReviewers({
            owner,
            repo,
            pull_number: number
          });
          
          const copilotRequested = reviews.data.users?.some(user => user.login === 'github-copilot[bot]') ||
                                  reviews.data.teams?.some(team => team.name === 'github-copilot');
          
          if (!copilotRequested) {
            // Request Copilot review
            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: number,
                reviewers: ['github-copilot[bot]']
              });
              console.log('✅ GitHub Copilot review requested successfully');
            } catch (error) {
              console.log('⚠️ Could not request Copilot review (may not be available for this repo)');
              console.log('Error:', error.message);
              
              // Fallback: Add informational comment about manual Copilot review
              const fallbackComment = `## 🤖 AI Code Review Available
              
              **GitHub Copilot code review is available for this repository!**
              
              ### How to get AI code review:
              1. **Manual Review**: Add \`@github-copilot\` as a reviewer in the reviewers section above
              2. **Automatic Reviews**: Repository admins can enable automatic Copilot reviews in repository settings
              
              ### 📱 Android Development Checklist
              This PR has been automatically analyzed. Please ensure the following:
              
              #### 🔒 Security Review
              - [ ] No hardcoded credentials or API keys
              - [ ] Proper input validation and sanitization
              - [ ] Secure network communications (HTTPS/TLS)
              - [ ] Authentication tokens handled securely
              
              #### 🎯 Kotlin Best Practices
              - [ ] Null safety properly handled
              - [ ] Coroutines used correctly for async operations
              - [ ] Extension functions used appropriately
              - [ ] Data classes for data structures
              
              #### 🧪 Testing & Quality
              - [ ] Unit tests cover new functionality
              - [ ] Integration tests for API interactions
              - [ ] Error handling tested
              - [ ] Edge cases considered
              
              ---
              **Note**: For full AI-powered code analysis, add GitHub Copilot as a reviewer above.
              
              *Generated by Android pCloud Player automated review system*`;
              
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: fallbackComment
              });
            }
          } else {
            console.log('ℹ️ GitHub Copilot review already requested');
          }
          
    - name: Add review checklist comment
      if: steps.changed-files.outputs.any_changed == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo, number } = context.issue;
          
          // Get list of changed files
          const changedFiles = `${{ steps.changed-files.outputs.all_changed_files }}`.split(' ');
          
          let filesList = '';
          changedFiles.forEach(file => {
            if (file.trim()) {
              filesList += `- \`${file}\`\n`;
            }
          });
          
          const reviewComment = `## 📋 Code Review Guidelines
          
          ### Files Changed:
          ${filesList}
          
          ### 📱 Android Architecture Checklist
          - [ ] Follows Android architecture patterns (MVVM/Repository)
          - [ ] Proper lifecycle management
          - [ ] UI thread safety considerations
          - [ ] Resource management (no memory leaks)
          
          ### 📝 Code Quality Standards
          - [ ] Code is self-documenting with clear variable names
          - [ ] Functions are focused and single-purpose
          - [ ] Proper separation of concerns
          - [ ] No code duplication
          
          ---
          **AI Review**: GitHub Copilot should provide detailed feedback above. If not visible, ensure Copilot is added as a reviewer.
          
          *Generated by Android pCloud Player automated review system*`;
          
          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number: number,
            body: reviewComment
          });